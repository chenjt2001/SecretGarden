name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build . --file Dockerfile --tag secret-garden:latest --label org.opencontainers.image.source=https://github.com/chenjt2001/SecretGarden

    - name: Save Docker image to tar file
      run: docker save secret-garden:latest -o secret-garden.tar

    - name: Upload tar file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: secret-garden.tar

    - name: Log in to GHCR
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image to GHCR
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      run: |
        docker tag secret-garden:latest ghcr.io/chenjt2001/secretgarden:latest
        docker push ghcr.io/chenjt2001/secretgarden:latest
